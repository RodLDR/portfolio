---
layout: default
---
<article class="project">
  <h1>{{ page.title }}</h1>
  <p class="project-summary">{{ page.summary }}</p>

  {% if page.tags %}
  <ul class="tag-list">
    {% for tag in page.tags %}
    <li class="tag">{{ tag }}</li>
    {% endfor %}
  </ul>
  {% endif %}

  {% if page.cover_image %}
  <img class="cover-image" src="{{ page.cover_image | relative_url }}" alt="{{ page.title }} cover image">
  {% endif %}

  {{ content }}

  {% if page.github %}
  <p><a href="{{ page.github }}" target="_blank" rel="noopener">View on GitHub &rarr;</a></p>
  {% endif %}

  <p><a href="{{ '/' | relative_url }}">&larr; Back to all projects</a></p>
</article>
